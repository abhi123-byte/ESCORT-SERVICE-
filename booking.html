<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Booking — LUXE</title><link rel="stylesheet" href="css/style.css"></head>
<body><header class="navbar" id="navbar"></header>
<main><section class="page-hero"><div class="container"><p class="eyebrow">PRIVATE ENQUIRY</p><h1>Book Talent</h1><p>Send your project details and the LUXE team can follow up.</p></div></section>
<section class="section"><div class="container form-wrap"><form id="bookingForm">
<div class="form-grid"><label>Name<input name="name" required></label><label>Email<input type="email" name="email" required></label><label>Phone<input name="phone"></label><label>Profile<select name="profile" id="bookingProfile"><option value="">Select profile</option></select></label><label>Project Type<select name="project"><option>Photography</option><option>Advertising</option><option>Editorial</option><option>Commercial</option><option>Brand Campaign</option></select></label><label>Location<input name="location" placeholder="City / venue"></label></div>
<label>Project Details<textarea name="details" rows="7" placeholder="Tell us about the project, dates and requirements." required></textarea></label>
<button class="gold-btn" type="submit">Send Booking Enquiry</button><p id="formMessage" class="form-message"></p></form></div></section></main><footer></footer>
<script src="js/profiles.js"></script><script src="js/script.js"></script></body></html>
